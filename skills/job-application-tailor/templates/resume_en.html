<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{FULL_NAME}} - Resume</title>
  <link rel="stylesheet" href="resume_style.css">
</head>
<body>
  <div class="resume-container">
    <header>
      <div>
        <h1 class="candidate-name">{{FULL_NAME}}</h1>
        <div class="target-title">{{TARGET_ROLE_TITLE}}</div>
        <div class="location-line">{{LOCATION}}</div>
      </div>
      <div class="contact-info">
        <span>Mobile: {{PHONE}}</span>
        <span>Email: {{EMAIL}}</span>
        {{LINKEDIN_HTML}}
        {{GITHUB_HTML}}
      </div>
    </header>

    <section id="summary">
      <h2 class="section-title">Summary</h2>
      <p class="summary-text">{{PROFESSIONAL_SUMMARY}}</p>
    </section>

    <section id="highlights">
      <h2 class="section-title">Highlights</h2>
      <div class="skills">{{SKILLS_PILLS}}</div>
    </section>

    <section id="experience">
      <h2 class="section-title">Experience</h2>
      {{EXPERIENCE_CONTENT}}
    </section>

    <section id="education">
      <h2 class="section-title">Education & Certifications</h2>
      {{EDUCATION_CONTENT}}
    </section>

    <footer class="languages">{{LANGUAGES_FOOTER}}</footer>
  </div>
</body>
</html>
