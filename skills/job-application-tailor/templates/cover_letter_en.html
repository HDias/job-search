<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cover Letter - {{FULL_NAME}}</title>
  <style>
    @page { size: A4; margin: 20mm 20mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #1e293b;
      line-height: 1.6;
      font-size: 10.5pt;
      background: #fff;
    }
    .container { max-width: 720px; margin: 0 auto; }
    header { border-bottom: 2px solid #0284c7; padding-bottom: 12px; margin-bottom: 20px; }
    h1 { font-size: 18pt; color: #0f172a; text-transform: uppercase; }
    .contact { font-size: 9pt; color: #475569; margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
    .date-recipient { margin-bottom: 20px; font-size: 10pt; color: #334155; }
    .content p { margin-bottom: 14px; text-align: justify; }
    .content ul { margin-left: 20px; margin-bottom: 14px; }
    .content li { margin-bottom: 6px; }
    .signature { margin-top: 30px; }
    .signature-name { font-weight: 700; color: #0f172a; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>{{FULL_NAME}}</h1>
      <div class="contact">
        <span>📍 {{LOCATION}}</span>
        <span>✉️ {{EMAIL}}</span>
        <span>📱 {{PHONE}}</span>
        <span>🔗 {{LINKEDIN_URL}}</span>
      </div>
    </header>

    <div class="date-recipient">
      <p>{{DATE}}</p>
      <p style="margin-top: 8px;"><strong>Dear Hiring Team / {{RECIPIENT_NAME}}</strong></p>
      <p>{{COMPANY_NAME}} - Ref: {{ROLE_TITLE}} Application</p>
    </div>

    <div class="content">
      {{COVER_LETTER_BODY}}
    </div>

    <div class="signature">
      <p>Sincerely,</p>
      <p class="signature-name" style="margin-top: 8px;">{{FULL_NAME}}</p>
    </div>
  </div>
</body>
</html>
